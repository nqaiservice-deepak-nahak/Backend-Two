apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-two
  namespace: {{ .Values.namespace }}
  labels:
    app: backend-two
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend-two
  template:
    metadata:
      labels:
        app: backend-two
    spec:
      containers:
        - name: backend-two
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          resources:
{{ toYaml .Values.resources | indent 12 }}
