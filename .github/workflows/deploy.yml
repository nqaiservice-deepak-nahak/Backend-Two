name: Deploy Backend Two to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}

  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

  BACKEND_TWO_IMAGE_URI: ${{ vars.BACKEND_TWO_IMAGE_URI }}
  BACKEND_TWO_PORT: ${{ vars.BACKEND_TWO_PORT }}
  BACKEND_TWO_MESSAGE: ${{ vars.BACKEND_TWO_MESSAGE }}

  ENVIRONMENT: ${{ vars.ENVIRONMENT }}

  BACKEND_TWO_REPLICA_COUNT: ${{ vars.BACKEND_TWO_REPLICA_COUNT }}
  BACKEND_TWO_CPU: ${{ vars.BACKEND_TWO_CPU }}
  BACKEND_TWO_MEMORY: ${{ vars.BACKEND_TWO_MEMORY }}

  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build-and-deploy:
    name: Build Push and Deploy Backend Two
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # 2. Login to Azure
      # ------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------
      # 3. Replace .env.prod placeholders
      # ------------------------------------------------
      - name: Prepare .env.prod
        shell: bash
        run: |
          sed -i "s|{{BACKEND_TWO_PORT}}|${BACKEND_TWO_PORT}|g" .env.prod
          sed -i "s|{{BACKEND_TWO_MESSAGE}}|${BACKEND_TWO_MESSAGE}|g" .env.prod
          sed -i "s|{{ENVIRONMENT}}|${ENVIRONMENT}|g" .env.prod

          echo ".env.prod prepared successfully"


      # ------------------------------------------------
      # 4. Login to Azure Container Registry
      # ------------------------------------------------
      - name: Login to ACR
        shell: bash
        run: |
          az acr login --name "${ACR_NAME}"


      # ------------------------------------------------
      # 5. Build Docker image
      # ------------------------------------------------
      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t "${BACKEND_TWO_IMAGE_URI}:${IMAGE_TAG}" \
            .


      # ------------------------------------------------
      # 6. Push Docker image to ACR
      # ------------------------------------------------
      - name: Push Docker image
        shell: bash
        run: |
          docker push "${BACKEND_TWO_IMAGE_URI}:${IMAGE_TAG}"


      # ------------------------------------------------
      # 7. Install kubectl
      # ------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4


      # ------------------------------------------------
      # 8. Install Helm
      # ------------------------------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4


      # ------------------------------------------------
      # 9. Connect GitHub runner to AKS
      # ------------------------------------------------
      - name: Get AKS credentials
        shell: bash
        run: |
          az aks get-credentials \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER_NAME}" \
            --admin \
            --overwrite-existing


      # ------------------------------------------------
      # 10. Replace Helm values.yaml placeholders
      # ------------------------------------------------
      - name: Prepare Helm values
        shell: bash
        run: |
          VALUES_FILE="helm/backend-two/values.yaml"

          sed -i "s|\$(K8S_NAMESPACE)|${K8S_NAMESPACE}|g" "${VALUES_FILE}"

          sed -i "s|\$(BACKEND_TWO_REPLICA_COUNT)|${BACKEND_TWO_REPLICA_COUNT}|g" "${VALUES_FILE}"

          sed -i "s|\$(BACKEND_TWO_IMAGE_URI)|${BACKEND_TWO_IMAGE_URI}|g" "${VALUES_FILE}"

          sed -i "s|\$(IMAGE_TAG)|${IMAGE_TAG}|g" "${VALUES_FILE}"

          sed -i "s|\$(BACKEND_TWO_PORT)|${BACKEND_TWO_PORT}|g" "${VALUES_FILE}"

          sed -i "s|\$(BACKEND_TWO_CPU)|${BACKEND_TWO_CPU}|g" "${VALUES_FILE}"

          sed -i "s|\$(BACKEND_TWO_MEMORY)|${BACKEND_TWO_MEMORY}|g" "${VALUES_FILE}"

          echo "Helm values prepared successfully"


      # ------------------------------------------------
      # 11. Validate Helm chart
      # ------------------------------------------------
      - name: Helm lint
        shell: bash
        run: |
          helm lint helm/backend-two


      # ------------------------------------------------
      # 12. Deploy Backend Two
      # ------------------------------------------------
      - name: Deploy Backend Two to AKS
        shell: bash
        run: |
          helm upgrade --install backend-two helm/backend-two \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 5m


      # ------------------------------------------------
      # 13. Verify deployment
      # ------------------------------------------------
      - name: Verify Backend Two
        shell: bash
        run: |
          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n "${K8S_NAMESPACE}"

          echo ""
          echo "========== PODS =========="
          kubectl get pods -n "${K8S_NAMESPACE}"

          echo ""
          echo "========== SERVICES =========="
          kubectl get svc -n "${K8S_NAMESPACE}"