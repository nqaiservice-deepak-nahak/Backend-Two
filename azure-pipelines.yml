trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend-two-variables

stages:
  - stage: BuildAndPush
    displayName: Build and push Backend Two
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Replace .env.prod placeholders
            inputs:
              targetType: inline
              script: |
                python3 scripts/replace_tokens.py .env.prod \
                  --replace '{{BACKEND_TWO_PORT}}=BACKEND_TWO_PORT' \
                  --replace '{{BACKEND_TWO_MESSAGE}}=BACKEND_TWO_MESSAGE' \
                  --replace '{{ENVIRONMENT}}=ENVIRONMENT'
            env:
              BACKEND_TWO_PORT: $(BACKEND_TWO_PORT)
              BACKEND_TWO_MESSAGE: $(BACKEND_TWO_MESSAGE)
              ENVIRONMENT: $(ENVIRONMENT)

          - task: Docker@2
            displayName: Build and push Backend Two image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: backend-two
              dockerfile: Dockerfile
              buildContext: .
              tags: |
                $(Build.BuildId)

  - stage: Deploy
    displayName: Deploy Backend Two with Helm
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: Deploy
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Replace values.yaml placeholders
            inputs:
              targetType: inline
              script: |
                python3 scripts/replace_tokens.py helm/backend-two/values.yaml \
                  --replace '$(K8S_NAMESPACE)=K8S_NAMESPACE' \
                  --replace '$(BACKEND_TWO_REPLICA_COUNT)=BACKEND_TWO_REPLICA_COUNT' \
                  --replace '$(BACKEND_TWO_IMAGE_URI)=BACKEND_TWO_IMAGE_URI' \
                  --replace '$(Build.BuildId)=BUILD_BUILD_ID' \
                  --replace '$(BACKEND_TWO_PORT)=BACKEND_TWO_PORT' \
                  --replace '$(BACKEND_TWO_CPU)=BACKEND_TWO_CPU' \
                  --replace '$(BACKEND_TWO_MEMORY)=BACKEND_TWO_MEMORY'
            env:
              K8S_NAMESPACE: $(K8S_NAMESPACE)
              BACKEND_TWO_REPLICA_COUNT: $(BACKEND_TWO_REPLICA_COUNT)
              BACKEND_TWO_IMAGE_URI: $(BACKEND_TWO_IMAGE_URI)
              BUILD_BUILD_ID: $(Build.BuildId)
              BACKEND_TWO_PORT: $(BACKEND_TWO_PORT)
              BACKEND_TWO_CPU: $(BACKEND_TWO_CPU)
              BACKEND_TWO_MEMORY: $(BACKEND_TWO_MEMORY)

          - task: AzureCLI@2
            displayName: Helm deploy Backend Two
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --overwrite-existing

                helm upgrade --install backend-two helm/backend-two \
                  --namespace "$(K8S_NAMESPACE)" \
                  --create-namespace

                kubectl get pods -n "$(K8S_NAMESPACE)"
                kubectl get svc -n "$(K8S_NAMESPACE)"
